[package]
name = "hs"
version = "0.1.0"
edition = "2024"
description = "A fast, private, project-aware shell history tool"
license = "MIT"

[dependencies]
r2d2 = "0.8"
r2d2_sqlite = "0.35"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
