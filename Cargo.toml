[package]
name = "hs"
version = "1.0.0"
edition = "2024"
description = "A fast, private, project-aware shell history tool"
license = "MIT"
repository = "https://github.com/unknownman/hs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
comfy-table = "7"
dialoguer = "0.12.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
